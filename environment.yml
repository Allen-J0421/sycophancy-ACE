# Conda environment for the sycophancy sandbox pipeline.
#
# Create on a new device with:
#     conda env create -f environment.yml
#     conda activate sycophancy-sandbox
#
# NOTE: This installs only the *Python* dependencies. The pipeline also shells
# out to external command-line tools that conda/pip cannot provide — see the
# "External tools" notes at the bottom of this file.

name: sycophancy-sandbox

channels:
  - conda-forge
  - defaults

dependencies:
  # --- Python runtime (matches the dev machine: 3.12.x) ---------------------
  - python=3.12

  # --- Plotting (plot_signals.py, plot_refdiff.py, result/plot.py) ----------
  - matplotlib>=3.8
  - pandas>=2.0

  # --- Tests (tests/) -------------------------------------------------------
  - pytest>=7.0

  # --- pip-only packages ----------------------------------------------------
  - pip
  - pip:
      # Gemini user-agent prompter (run_experiment.py --prompter).
      # Mirrors requirements-prompter.txt.
      - google-genai>=1.0

# ---------------------------------------------------------------------------
# External tools (NOT installed by this file — install separately):
#
#   git              version control (all phases).
#   claude  CLI      coding agent for `claude-*` models  (run_experiment.py).
#   codex   CLI      coding agent for non-claude models  (run_experiment.py).
#   JDK <= 23        required by RefDiff/Gradle (run_refdiff.py). Point
#                    JAVA_HOME at it, e.g. `brew install openjdk@21`.
#                    Gradle itself is provided by the bundled wrapper
#                    (refdiff-runner/gradlew), so no separate Gradle install.
#
# RefDiff-JS also vendors Node tooling under refdiff-runner/; Node is only
# needed if you regenerate that vendored parser (not for normal runs).
# ---------------------------------------------------------------------------
