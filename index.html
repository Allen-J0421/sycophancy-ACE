<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACE USC Sycophancy</title>
  <style>* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 1.5rem 2rem;
}

h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 600;
}

.subtitle {
  margin: 0.35rem 0 0;
  color: #666;
  font-size: 0.95rem;
}

main {
  padding: 1.5rem 2rem 2.5rem;
  max-width: 1100px;
  margin: 0 auto;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

.card {
  display: block;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 1rem 1.15rem;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s;
}

a.card:hover {
  border-color: #999;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.card.pending {
  cursor: default;
  background: #fafafa;
  color: #555;
}

.card.pending:hover {
  border-color: #ddd;
  box-shadow: none;
}

.card-title {
  margin: 0 0 0.35rem;
  font-size: 1.05rem;
  font-weight: 600;
}

.card-meta {
  margin: 0;
  font-size: 0.85rem;
  color: #666;
  line-height: 1.45;
}

.card-hint {
  margin: 0.6rem 0 0;
  font-size: 0.8rem;
  color: #888;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.empty-state {
  color: #666;
  font-size: 0.95rem;
}

.empty-state code {
  font-size: 0.85rem;
}
</style>
</head>
<body>
  <header>
    <h1>ACE USC Sycophancy</h1>
    <p class="subtitle">Experiment dashboards</p>
  </header>

  <main>
    <div id="dashboard-grid" class="dashboard-grid"></div>
    <p id="empty-state" class="empty-state" hidden>
      No dashboards found. Build one with:
      <code>python dashboard/build.py --exp &lt;folder&gt;</code>
    </p>
  </main>

  <script>(function () {
  const grid = document.getElementById("dashboard-grid");
  const empty = document.getElementById("empty-state");
  const items = window.__DASHBOARDS__ || [];

  if (!items.length) {
    empty.hidden = false;
    return;
  }

  items.forEach((item) => {
    if (item.pending) {
      const card = document.createElement("div");
      card.className = "card pending";
      card.innerHTML =
        `<h2 class="card-title">${escapeHtml(item.title)}</h2>` +
        `<p class="card-meta">${escapeHtml(item.subtitle || "")}</p>` +
        `<p class="card-hint">python dashboard/build.py --exp ${escapeHtml(item.id)}</p>`;
      grid.appendChild(card);
      return;
    }

    const link = document.createElement("a");
    link.className = "card";
    link.href = item.href;
    link.innerHTML =
      `<h2 class="card-title">${escapeHtml(item.title)}</h2>` +
      `<p class="card-meta">${escapeHtml(item.subtitle || "")}</p>`;
    grid.appendChild(link);
  });

  function escapeHtml(text) {
    const el = document.createElement("span");
    el.textContent = text;
    return el.innerHTML;
  }
})();
</script>
</body>
</html>
