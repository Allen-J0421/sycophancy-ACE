plugins {
    id 'java'
    id 'application'
}

group = 'edu.usc.sycophancy'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.aserg-ufmg:refdiff-java:2.0.0'
    implementation 'com.github.aserg-ufmg:refdiff-js:2.0.0'
    implementation 'com.eclipsesource.j2v8:j2v8_macosx_x86_64:4.6.0'
    implementation 'com.eclipsesource.j2v8:j2v8_linux_x86_64:4.6.0'
    implementation 'com.eclipsesource.j2v8:j2v8_win32_x86_64:4.6.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.8.9'
}

java {
    toolchain {
        // RefDiff's published Java artifacts depend on Eclipse JDT, which requires a modern JVM at runtime.
        // Use a recent toolchain for both compilation and `gradle run`.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'edu.usc.sycophancy.refdiff.RefDiffRunner'
}

// RefDiff's JS plugin extracts its bundled (ancient) @babel/parser into
// `${java.io.tmpdir}/refdiff_node_modules` and reuses it if already present.
// Pin java.io.tmpdir to a deterministic, project-local directory so the host
// (run_refdiff.py) can pre-seed a modern @babel/parser there before the run.
run {
    def refdiffTmp = project.hasProperty('refdiffTmpdir')
        ? project.property('refdiffTmpdir')
        : "${projectDir}/.refdiff-node-tmp"
    doFirst { file(refdiffTmp).mkdirs() }
    systemProperty 'java.io.tmpdir', refdiffTmp
}
