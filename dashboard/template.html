<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment Dashboard</title>
  <style>/*__STYLE__*/</style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1 id="exp-title">Experiment Dashboard</h1>
    <div id="model-tabs" class="model-tabs"></div>
  </header>

  <main>
    <section class="chart-wrap">
      <canvas id="chart"></canvas>
    </section>

    <section class="step-nav">
      <button type="button" id="prev-btn">← Prev</button>
      <span id="step-label" class="step-label">Step 1 of 1</span>
      <button type="button" id="next-btn">Next →</button>
      <span id="step-meta" class="step-meta"></span>
    </section>

    <section class="panels">
      <div class="panel panel-signals">
        <div class="panel-header">
          <h2>Signals</h2>
          <div class="panel-actions">
            <button type="button" id="sets-btn" disabled>Sets Status</button>
          </div>
        </div>
        <div id="signals-pre" class="signals-view"></div>
      </div>
      <div class="panel panel-refdiff">
        <div class="panel-header">
          <h2>RefDiff</h2>
          <div class="panel-actions">
            <button type="button" id="matcher-discarded-btn" disabled>Matcher Discarded</button>
            <button type="button" id="refdiff-btn" disabled>refdiff.jsonl</button>
          </div>
        </div>
        <div id="refdiff-pre" class="refdiff-view"></div>
      </div>
      <div class="panel">
        <h2>Diff</h2>
        <pre id="diff-pre" class="diff-pre"></pre>
      </div>
      <div class="panel">
        <div class="panel-header">
          <h2>Agent response</h2>
          <div class="panel-actions">
            <button type="button" id="reasoning-btn" disabled>Reasoning</button>
            <button type="button" id="codex-btn" disabled>codex.jsonl</button>
          </div>
        </div>
        <pre id="response-pre"></pre>
      </div>
    </section>
  </main>

  <dialog id="reasoning-dialog">
    <pre id="reasoning-pre"></pre>
    <button type="button" id="reasoning-close">Close</button>
  </dialog>

  <dialog id="codex-dialog">
    <pre id="codex-pre"></pre>
    <button type="button" id="codex-close">Close</button>
  </dialog>

  <dialog id="refdiff-dialog">
    <pre id="refdiff-dialog-pre"></pre>
    <button type="button" id="refdiff-close">Close</button>
  </dialog>

  <dialog id="matcher-discarded-dialog">
    <pre id="matcher-discarded-pre"></pre>
    <button type="button" id="matcher-discarded-close">Close</button>
  </dialog>

  <dialog id="sets-dialog">
    <div id="sets-dialog-body" class="sets-dialog-body"></div>
    <button type="button" id="sets-close">Close</button>
  </dialog>

  <script>
    window.__EXPERIMENT_DATA__ = /*__DATA__*/;
  </script>
  <script>/*__APP_JS__*/</script>
</body>
</html>
